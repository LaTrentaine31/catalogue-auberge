utton');b.className='tab'+(active===r?' active':'');b.textContent=r==='Toutes'?'Toutes les cartes':r;b.onclick=()=>{active=r;render()};nav.append(b)}const q=search.value.toLocaleLowerCase('fr').trim();const shown=cards.filter(c=>(active==='Toutes'||c.rarity===active)&&c.name.toLocaleLowerCase('fr').includes(q));count.textContent=shown.length+' carte'+(shown.length>1?'s':'')+' affichée'+(shown.length>1?'s':'')+' · '+cards.length+' cartes au catalogue';grid.replaceChildren();for(const c of shown){const el=document.createElement('article');el.className='card';const n=document.createElement('span');n.className='num';n.textContent='#'+String(c.id).padStart(2,'0');const img=document.createElement('img');img.src=c.image;img.alt='Carte '+c.name;img.loading='lazy';const title=document.createElement('strong');title.textContent=c.name;const sub=document.createElement('small');sub.textContent=c.rarity;el.append(n,img,title,sub);el.onclick=()=>show(c);grid.append(el)}}function show(c){modal.replaceChildren();const close=document.createElement('button');close.textContent='Fermer ×';close.onclick=()=>modal.close();const title=document.createElement('h2');title.textContent=c.name;const img=document.createElement('img');img.src=c.image;img.alt=c.name;const p=document.createElement('p');p.textContent='#'+String(c.id).padStart(2,'0')+' · '+c.rarity+' · '+c.stars+' étoile'+(c.stars>1?'s':'');modal.append(close,title,img,p);modal.showModal()}search.addEventListener('input',render);render();</script></body></html>
