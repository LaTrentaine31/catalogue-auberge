<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Grimoire de l’Auberge</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#25476c,#081527 70%);color:#f8e9c9;font-family:Georgia,serif;min-height:100vh}header{text-align:center;padding:42px 16px 25px;background:linear-gradient(#112c50aa,transparent)}h1{font-size:clamp(27px,5vw,48px);margin:0;color:#ffdf98;text-shadow:0 3px 10px #000}header p{color:#c4d8ed;margin:10px}main{max-width:1180px;margin:auto;padding:15px}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:10px 0 22px}.tab{cursor:pointer;border:1px solid #c99c52;background:#122c4c;color:#f5e1b9;border-radius:20px;padding:11px 15px;font:600 14px Arial}.tab.active,.tab:hover{background:#b7883b;color:#07152b}input{display:block;margin:0 auto 24px;width:min(500px,100%);padding:14px 18px;border:1px solid #c99c52;border-radius:12px;background:#07172a;color:white;font:16px Arial}#count{text-align:center;color:#b9cbe0;font:14px Arial;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:22px}.card{cursor:pointer;background:linear-gradient(145deg,#23466f,#0a1c34);border:2px solid #bb8b44;border-radius:15px;padding:11px 10px 14px;text-align:center;box-shadow:0 8px 18px #0008;transition:transform .2s}.card:hover{transform:translateY(-5px);box-shadow:0 8px 28px #e3a94e55}.card img{display:block;width:100%;height:240px;object-fit:contain}.card strong{display:block;margin:10px 0 5px;overflow-wrap:anywhere}.card small{font:12px Arial;color:#b8cce3}.card .num{color:#f8d58c;font:700 12px Arial}dialog{max-width:min(94vw,650px);max-height:94vh;overflow:auto;background:linear-gradient(#17375b,#09182c);color:#fff1d5;border:3px solid #caa15d;border-radius:18px;padding:20px;text-align:center;box-shadow:0 15px 70px #000}dialog::backdrop{background:#000c}dialog img{display:block;max-width:100%;max-height:65vh;object-fit:contain;margin:auto}dialog button{float:right;cursor:pointer;background:#bb8c43;border:0;border-radius:6px;padding:8px 13px;font-weight:bold}dialog h2{margin:10px 0}dialog p{font:14px Arial;color:#c6d9ee}footer{text-align:center;color:#9bb0c6;padding:50px 15px;font:12px Arial}@media(max-width:500px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card img{height:190px}.card{padding:7px}.tab{font-size:12px;padding:9px 10px}} .panel{background:#10243e;border:1px solid #bb8b44;border-radius:15px;padding:20px;margin:16px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}.toolbar input{margin:0;width:min(340px,100%)}select,button{font:14px Arial}select{background:#10243e;color:#fff1d5;border:1px solid #bb8b44;border-radius:8px;padding:12px;max-width:100%}.missing img{filter:grayscale(1);opacity:.35}.quantity{display:inline-block;background:#081527;border:1px solid #bb8b44;border-radius:12px;padding:5px 10px;margin:5px}.metrics{display:flex;flex-wrap:wrap;justify-content:space-around;gap:18px;text-align:center}.metrics b{display:block;font-size:26px;color:#ffdf98}.metrics span{font:13px Arial;color:#c4d8ed}progress{width:100%;accent-color:#c99c52;height:12px}table{width:100%;border-collapse:collapse;font:14px Arial}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #39516a}a{color:#ffdf98}button:focus-visible,a:focus-visible{outline:3px solid white}.scroll{overflow:auto}.card{color:inherit;font-family:Georgia,serif;width:100%}#status{text-align:center;color:#c4d8ed;font:13px Arial}h2{text-align:center;color:#ffdf98}dialog button{float:none;margin:5px} .empty{text-align:center;padding:30px} .cosintro{text-align:center;color:#b9cbe0}.objectives{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.objective{border:1px solid #b88d50;border-radius:16px;background:linear-gradient(140deg,#193553,#101c34);padding:16px}.objective.planet{border-color:#a48adf;background:linear-
